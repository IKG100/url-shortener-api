name: url_shortener_api_dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: url_shortener_api_dev_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - url-shortener-api-dev-network

volumes:
  postgres_data:
    driver: local

networks:
  url-shortener-api-dev-network:
    driver: bridge
